name: Deploy wiki

on:
  # 1. 自动触发：当代码推送到 main 分支时
  push:
    branches:
      - main

  # 2. 手动触发：在 GitHub Actions 页面显示"Run workflow"按钮
  workflow_dispatch:

permissions:
  contents: write

