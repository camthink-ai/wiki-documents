<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F24A00"/>
    </marker>
  </defs>

  <!-- ============ 通道 1:Wi-Fi(局域网部署) ============ -->
  <rect x="8" y="16" width="700" height="168" rx="12" fill="#FAFAFB" stroke="#E5E7EB"/>
  <text x="24" y="62" font-size="14" font-weight="700" fill="#1C1E21">Wi-Fi</text>
  <text x="24" y="82" font-size="11.5" fill="#6B7280">同局域网 · 无需公网</text>

  <rect x="150" y="88" width="100" height="56" rx="10" fill="#1C1E21"/>
  <text x="200" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">NE101 ×N</text>

  <line x1="252" y1="116" x2="296" y2="116" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="274" y="104" text-anchor="middle" font-size="11.5" fill="#C2410C">Wi-Fi</text>

  <rect x="300" y="88" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="355" y="121" text-anchor="middle" font-size="13" fill="#374151">AP / 路由器</text>

  <line x1="412" y1="116" x2="456" y2="116" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="434" y="104" text-anchor="middle" font-size="11.5" fill="#C2410C">局域网</text>

  <rect x="460" y="88" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="570" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1E21">NG4500 · NeoMind</text>
  <text x="570" y="130" text-anchor="middle" font-size="11" fill="#6B7280">MQTT 1883 · 本地识别与入库</text>

  <line x1="682" y1="116" x2="726" y2="116" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>

  <!-- ============ 通道 2:Wi-Fi HaLow(远距离) ============ -->
  <rect x="8" y="196" width="700" height="168" rx="12" fill="#FAFAFB" stroke="#E5E7EB"/>
  <text x="24" y="242" font-size="14" font-weight="700" fill="#1C1E21">Wi-Fi HaLow</text>
  <text x="24" y="262" font-size="11.5" fill="#6B7280">网关中继 · 远距离</text>

  <rect x="150" y="268" width="100" height="56" rx="10" fill="#1C1E21"/>
  <text x="200" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">NE101 ×N</text>

  <line x1="252" y1="296" x2="296" y2="296" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="274" y="284" text-anchor="middle" font-size="11.5" fill="#C2410C">HaLow</text>

  <rect x="300" y="268" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="355" y="301" text-anchor="middle" font-size="13" fill="#374151">HaLow 网关</text>

  <line x1="412" y1="296" x2="456" y2="296" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="434" y="284" text-anchor="middle" font-size="11.5" fill="#C2410C">局域网</text>

  <rect x="460" y="268" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="570" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1E21">NG4500 · NeoMind</text>
  <text x="570" y="310" text-anchor="middle" font-size="11" fill="#6B7280">与 Wi-Fi 方式部署一致</text>

  <line x1="682" y1="296" x2="726" y2="296" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>

  <!-- ============ 通道 3:Cat.1(直连上云) ============ -->
  <rect x="8" y="376" width="700" height="168" rx="12" fill="#FAFAFB" stroke="#E5E7EB"/>
  <text x="24" y="422" font-size="14" font-weight="700" fill="#1C1E21">Cat.1</text>
  <text x="24" y="442" font-size="11.5" fill="#6B7280">直连上云 · 分散表计</text>

  <rect x="150" y="448" width="100" height="56" rx="10" fill="#1C1E21"/>
  <text x="200" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">NE101 ×N</text>

  <line x1="252" y1="476" x2="296" y2="476" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="274" y="464" text-anchor="middle" font-size="11.5" fill="#C2410C">Cat.1</text>

  <rect x="300" y="448" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="355" y="481" text-anchor="middle" font-size="13" fill="#374151">运营商网络</text>

  <line x1="412" y1="476" x2="456" y2="476" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="434" y="464" text-anchor="middle" font-size="11.5" fill="#C2410C">互联网</text>

  <rect x="460" y="448" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="570" y="471" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1E21">云服务器 · NeoMind</text>
  <text x="570" y="490" text-anchor="middle" font-size="11" fill="#6B7280">云端部署 · 公网可达</text>

  <line x1="682" y1="476" x2="726" y2="476" stroke="#F24A00" stroke-width="1.6" marker-end="url(#flow)"/>

  <!-- ============ 右侧:业务系统 ============ -->
  <rect x="730" y="60" width="132" height="440" rx="12" fill="#1C1E21"/>
  <text x="796" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">业务系统</text>
  <line x1="752" y1="122" x2="840" y2="122" stroke="#374151" stroke-width="1"/>
  <text x="796" y="156" text-anchor="middle" font-size="12" fill="#E5E7EB">OpenAPI</text>
  <text x="796" y="182" text-anchor="middle" font-size="12" fill="#E5E7EB">Data Push</text>
  <text x="796" y="208" text-anchor="middle" font-size="12" fill="#E5E7EB">Webhook</text>
  <text x="796" y="248" text-anchor="middle" font-size="11" fill="#9CA3AF">仅对接 NeoMind</text>
  <text x="796" y="266" text-anchor="middle" font-size="11" fill="#9CA3AF">对外接口</text>

  <!-- ============ 底部:通用要求 ============ -->
  <rect x="8" y="556" width="854" height="52" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="24" y="578" font-size="12.5" fill="#9A3412"><tspan font-weight="700">通用要求</tspan>  NE101 需可路由至 NeoMind 的 MQTT 端口(内置 Broker,默认 TCP 1883,可启用 MQTTS)</text>
  <text x="24" y="598" font-size="12.5" fill="#9A3412">读数识别与数据入库均在主机本地完成,业务系统仅通过 OpenAPI / Data Push / Webhook 对接</text>
</svg>
