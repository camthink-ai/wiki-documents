<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F24A00"/>
    </marker>
  </defs>

  <!-- camera group -->
  <rect x="55" y="70" width="150" height="80" rx="10" fill="#1C1E21"/>
  <text x="130" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">NE503 cameras ×N</text>
  <text x="130" y="128" text-anchor="middle" font-size="10.5" fill="#9CA3AF">1 per zone · PoE powered</text>

  <line x1="207" y1="110" x2="306" y2="110" stroke="#F24A00" stroke-width="2" marker-end="url(#flow)"/>
  <text x="256" y="98" text-anchor="middle" font-size="11" fill="#C2410C">PoE cable · LAN</text>

  <!-- host -->
  <rect x="310" y="70" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="435" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1E21">Customer host · NeoMind</text>
  <text x="435" y="122" text-anchor="middle" font-size="11" fill="#6B7280">gym-tracker extension · local inference & ingestion</text>

  <line x1="562" y1="110" x2="661" y2="110" stroke="#F24A00" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#flow)"/>
  <text x="612" y="98" text-anchor="middle" font-size="11" fill="#C2410C">OpenAPI / Data Push</text>

  <!-- business systems (optional) -->
  <rect x="665" y="70" width="160" height="80" rx="10" fill="#1C1E21"/>
  <text x="745" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Business systems</text>
  <text x="745" y="128" text-anchor="middle" font-size="10.5" fill="#9CA3AF">member management / CRM</text>
  <text x="745" y="168" text-anchor="middle" font-size="10.5" fill="#6B7280">(optional)</text>

  <!-- note strip -->
  <rect x="55" y="200" width="770" height="86" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="73" y="230" font-size="12" fill="#9A3412"><tspan font-weight="700">General</tspan>  Camera and host on the same LAN, no public IP needed; cameras powered by the customer-side PoE switch / injector</text>
  <text x="73" y="254" font-size="12" fill="#9A3412">Bandwidth: video via the 720p sub-stream (~2–4Mbps per camera), event stream under 100KB/s — a regular LAN handles it</text>
  <text x="73" y="274" font-size="12" fill="#9A3412">Data stays on-premises; sent out only when a business system is integrated</text>
</svg>