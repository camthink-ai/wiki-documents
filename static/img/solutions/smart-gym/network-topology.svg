<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F24A00"/>
    </marker>
  </defs>

  <!-- camera group -->
  <rect x="55" y="70" width="150" height="80" rx="10" fill="#1C1E21"/>
  <text x="130" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">NE503 相机 ×N</text>
  <text x="130" y="128" text-anchor="middle" font-size="10.5" fill="#9CA3AF">每区域 1 台 · PoE 供电</text>

  <line x1="207" y1="110" x2="306" y2="110" stroke="#F24A00" stroke-width="2" marker-end="url(#flow)"/>
  <text x="256" y="98" text-anchor="middle" font-size="11" fill="#C2410C">PoE 网线 · 局域网</text>

  <!-- host -->
  <rect x="310" y="70" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="435" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1E21">客户主机 · NeoMind</text>
  <text x="435" y="122" text-anchor="middle" font-size="11" fill="#6B7280">gym-tracker 扩展 · 本地识别与入库</text>

  <line x1="562" y1="110" x2="661" y2="110" stroke="#F24A00" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#flow)"/>
  <text x="612" y="98" text-anchor="middle" font-size="11" fill="#C2410C">OpenAPI / Data Push</text>

  <!-- business systems (optional) -->
  <rect x="665" y="70" width="160" height="80" rx="10" fill="#1C1E21"/>
  <text x="745" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">业务系统</text>
  <text x="745" y="128" text-anchor="middle" font-size="10.5" fill="#9CA3AF">会员管理 / CRM</text>
  <text x="745" y="168" text-anchor="middle" font-size="10.5" fill="#6B7280">(可选对接)</text>

  <!-- note strip -->
  <rect x="55" y="200" width="770" height="86" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="73" y="230" font-size="12" fill="#9A3412"><tspan font-weight="700">通用要求</tspan>  相机与主机同一局域网,主机无需公网;相机由客户侧 PoE 交换机 / 注入器供电</text>
  <text x="73" y="254" font-size="12" fill="#9A3412">带宽:每相机视频走 720p 子码流(约 2~4Mbps),事件流低于 100KB/s,常规局域网即可承载</text>
  <text x="73" y="274" font-size="12" fill="#9A3412">数据留在场馆本地;对接业务系统时才按需外发</text>
</svg>