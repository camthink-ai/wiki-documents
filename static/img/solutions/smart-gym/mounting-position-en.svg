<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs><marker id="axarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F24A00"/></marker></defs>
  <!-- room -->
  <rect x="50" y="70" width="780" height="400" rx="4" fill="#FAFAFB" stroke="#1C1E21" stroke-width="2.5"/>
  <!-- diagonal FOV wedge from top-left corner -->
  <polygon points="110,140 830,270 830,470 150,470" fill="#F24A00" fill-opacity="0.06"/>
  <line x1="110" y1="140" x2="830" y2="270" stroke="#F24A00" stroke-width="1.4" stroke-dasharray="6 4" stroke-opacity="0.55"/>
  <line x1="110" y1="140" x2="150" y2="470" stroke="#F24A00" stroke-width="1.4" stroke-dasharray="6 4" stroke-opacity="0.55"/>
  <!-- camera at top-left corner -->
  <circle cx="110" cy="140" r="15" fill="#1C1E21"/>
  <circle cx="110" cy="140" r="6" fill="#F24A00"/>
  <text x="140" y="112" font-size="13.5" font-weight="700" fill="#1C1E21">NE503 diagonal ceiling mount · 2.5–3.5m · 15–30° tilt</text>
  <line x1="150" y1="160" x2="806" y2="380" stroke="#F24A00" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#axarrow)"/>
  <text x="250" y="182" font-size="11" fill="#C2410C">FOV axis → entrance</text>
  <!-- glare window top-right -->
  <rect x="560" y="64" width="120" height="12" fill="#BFE3FF" stroke="#93C5FD"/>
  <text x="620" y="110" text-anchor="middle" font-size="11.5" fill="#2563EB">Glare window · keep FOV away</text>
  <!-- free area top-right corner (outside FOV) -->
  <rect x="690" y="88" width="140" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="5 4"/>
  <text x="760" y="114" text-anchor="middle" font-size="11.5" fill="#6B7280">Free area</text>
  <text x="760" y="132" text-anchor="middle" font-size="10" fill="#9CA3AF">(optional)</text>
  <!-- zone A -->
  <rect x="300" y="230" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="390" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2410C">Equipment Zone A · ROI</text>
  <rect x="318" y="272" width="34" height="54" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="362" y="272" width="34" height="54" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="406" y="272" width="34" height="54" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <!-- zone B -->
  <rect x="470" y="300" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="560" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2410C">Equipment Zone B · ROI</text>
  <rect x="488" y="342" width="34" height="54" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="532" y="342" width="34" height="54" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <rect x="576" y="342" width="34" height="54" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
  <!-- members -->
  <g fill="#1C1E21" stroke="#F24A00" stroke-width="2.5">
    <circle cx="390" cy="255" r="8"/>
    <circle cx="560" cy="355" r="8"/>
    <circle cx="700" cy="420" r="8"/>
  </g>
  <text x="412" y="260" font-size="11" fill="#6B7280">member</text>
  <!-- entrance on right wall -->
  <rect x="824" y="330" width="12" height="120" fill="#FAFAFB"/>
  <line x1="830" y1="330" x2="830" y2="340" stroke="#1C1E21" stroke-width="2.5"/>
  <line x1="830" y1="450" x2="830" y2="470" stroke="#1C1E21" stroke-width="2.5"/>
  <line x1="830" y1="340" x2="830" y2="450" stroke="#1C1E21" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="830" y1="340" x2="772" y2="340" stroke="#1C1E21" stroke-width="2"/>
  <path d="M772,340 A62,62 0 0 1 830,402" fill="none" stroke="#1C1E21" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="812" y="312" text-anchor="end" font-size="12.5" font-weight="700" fill="#C2410C">Entrance · check-in recognition</text>
  <text x="812" y="294" text-anchor="end" font-size="10.5" fill="#6B7280">3s dwell debounce filters passers-by</text>
  <!-- legend strip -->
  <rect x="50" y="505" width="780" height="52" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="68" y="527" font-size="12" fill="#9A3412">Recommended diagonal corner mount: the view cuts across the room covering the entrance and main equipment zones</text>
  <text x="68" y="547" font-size="12" fill="#9A3412">Verify live: full skeletons at range, entrance in frame, no obstructions — then lock the mount</text>
</svg>