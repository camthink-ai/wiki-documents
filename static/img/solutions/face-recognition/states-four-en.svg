    <text x="194" y="283" text-anchor="start" font-size="11.5" fill="#FFFFFF">#5 92% zhangsan 93%</text>
    <rect x="52" y="272" width="110" height="24" rx="12" fill="#22C55E"/>
    <text x="107" y="288" text-anchor="middle" font-size="12" fill="#1C1E21" font-weight="700">Recognized</text>
