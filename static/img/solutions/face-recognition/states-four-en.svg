    <text x="614" y="283" text-anchor="start" font-size="11.5" fill="#FFFFFF">#5 92% timeout</text>
    <rect x="472" y="272" width="130" height="24" rx="12" fill="#EF4444"/>
    <text x="537" y="288" text-anchor="middle" font-size="12" fill="#450A0A" font-weight="700">Timeout/Error</text>
