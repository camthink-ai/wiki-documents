<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F24A00"/>
    </marker>
    <marker id="flowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="flowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1E21">Network topology (same LAN, camera needs no public network)</text>

  <!-- LAN boundary -->
  <rect x="30" y="56" width="840" height="200" rx="14" fill="#FAFAFA" stroke="#D1D5DB" stroke-dasharray="8 6"/>
  <text x="52" y="80" font-size="12" font-weight="700" fill="#6B7280">Customer LAN</text>

  <!-- camera -->
  <rect x="60" y="100" width="170" height="120" rx="10" fill="#1C1E21"/>
  <text x="145" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">NE302 camera</text>
  <text x="145" y="152" text-anchor="middle" font-size="10.5" fill="#9CA3AF">Wi-Fi 6</text>
  <text x="145" y="172" text-anchor="middle" font-size="10.5" fill="#9CA3AF">USB Type-C 5V power</text>
  <text x="145" y="192" text-anchor="middle" font-size="10.5" fill="#FDBA74">detect / track / mosaic / crop report</text>

  <!-- router -->
  <rect x="330" y="118" width="150" height="84" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="405" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1E21">Router / AP</text>
  <text x="405" y="174" text-anchor="middle" font-size="10.5" fill="#6B7280">Wi-Fi · LAN ports</text>

  <line x1="234" y1="160" x2="326" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#flow)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#6B7280">Wi-Fi</text>

  <!-- backend host -->
  <rect x="580" y="100" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="670" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1E21">Recognition backend host</text>
  <text x="670" y="152" text-anchor="middle" font-size="10.5" fill="#6B7280">own service or mock backend script</text>
  <text x="670" y="172" text-anchor="middle" font-size="10.5" fill="#6B7280">同网段延迟 &lt; 1 秒</text>
  <text x="670" y="192" text-anchor="middle" font-size="10.5" fill="#FDBA74">face gallery (sensitive)</text>

  <line x1="484" y1="160" x2="576" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#flow)"/>
  <text x="530" y="148" text-anchor="middle" font-size="10.5" fill="#6B7280">网线</text>

  <!-- viewers -->
  <rect x="60" y="290" width="180" height="58" rx="10" fill="#1C1E21"/>
  <text x="150" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Browser</text>
  <text x="150" y="332" text-anchor="middle" font-size="10.5" fill="#9CA3AF">camera web (preview / config)</text>
  <path d="M150 286 L150 226" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#flow)"/>

  <!-- channel A webhook -->
  <path d="M234 120 C 340 60, 480 60, 576 120" fill="none" stroke="#F24A00" stroke-width="2" marker-end="url(#flow)"/>
  <text x="405" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">Channel A · Webhook (sync)</text>
  <text x="405" y="84" text-anchor="middle" font-size="10.5" fill="#C2410C">HTTP POST face image → result in response (no broker)</text>

  <!-- channel B mqtt -->
  <path d="M234 200 C 340 258, 480 258, 576 200" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#flowb)"/>
  <text x="405" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">Channel B · MQTT (async)</text>
  <text x="405" y="261" text-anchor="middle" font-size="10.5" fill="#1D4ED8">via broker: report topic out · receive topic back</text>

  <!-- external broker optional -->
  <rect x="790" y="118" width="0" height="0" fill="none"/>
  <rect x="580" y="240" width="180" height="0" rx="0" fill="none"/>

  <!-- requirements note -->
  <rect x="30" y="362" width="840" height="30" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="450" y="382" text-anchor="middle" font-size="11" fill="#9A3412">Bandwidth: video stays on the camera preview; reports are event-driven (tens of KB each) · MQTT needs a broker (public brokers: demo data only)</text>
</svg>
