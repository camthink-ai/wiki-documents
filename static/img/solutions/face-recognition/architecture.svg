<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F24A00"/>
    </marker>
    <marker id="flowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- camera -->
  <rect x="40" y="60" width="180" height="150" rx="10" fill="#1C1E21"/>
  <text x="130" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">NE302 AI 相机</text>
  <text x="130" y="110" text-anchor="middle" font-size="10.5" fill="#9CA3AF">STM32N6 · Neural-ART NPU</text>
  <line x1="58" y1="122" x2="202" y2="122" stroke="#374151" stroke-width="1"/>
  <text x="130" y="141" text-anchor="middle" font-size="11" fill="#FDBA74">YuNet 检测 ~7ms</text>
  <text x="130" y="159" text-anchor="middle" font-size="11" fill="#FDBA74">IoU 跟踪 · 稳定 ID</text>
  <text x="130" y="177" text-anchor="middle" font-size="11" fill="#FDBA74">马赛克(仅视频流)</text>
  <text x="130" y="195" text-anchor="middle" font-size="11" fill="#FDBA74">裁剪上报(未打码)</text>

  <!-- uplink arrows -->
  <line x1="224" y1="105" x2="356" y2="105" stroke="#F24A00" stroke-width="2" marker-end="url(#flow)"/>
  <text x="290" y="93" text-anchor="middle" font-size="11" fill="#C2410C">人脸裁剪图</text>

  <line x1="224" y1="165" x2="356" y2="165" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flowb)"/>
  <text x="290" y="153" text-anchor="middle" font-size="11" fill="#1D4ED8">识别结果</text>

  <!-- backend -->
  <rect x="360" y="60" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="460" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1E21">识别后端</text>
  <text x="460" y="112" text-anchor="middle" font-size="10.5" fill="#6B7280">客户自有识别服务</text>
  <text x="460" y="130" text-anchor="middle" font-size="10.5" fill="#6B7280">或模拟后端(ArcFace)</text>
  <line x1="378" y1="142" x2="542" y2="142" stroke="#E5E7EB" stroke-width="1"/>
  <text x="460" y="161" text-anchor="middle" font-size="11" fill="#F24A00">特征比对</text>
  <text x="460" y="179" text-anchor="middle" font-size="11" fill="#F24A00">gallery 人脸库</text>
  <text x="460" y="197" text-anchor="middle" font-size="11" fill="#F24A00">按 request_id 回传</text>

  <!-- overlay result back to stream -->
  <path d="M460 216 L460 262 L130 262 L130 218" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#flowb)"/>
  <text x="295" y="252" text-anchor="middle" font-size="11" fill="#1D4ED8">结果按跟踪 ID 关联 → 画面叠加姓名</text>

  <!-- viewers -->
  <rect x="40" y="286" width="270" height="56" rx="10" fill="#1C1E21"/>
  <text x="175" y="309" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">浏览器 · 相机 Web 预览</text>
  <text x="175" y="328" text-anchor="middle" font-size="10.5" fill="#9CA3AF">框 + ID + 姓名(烧录在视频流内)</text>

  <rect x="340" y="286" width="220" height="56" rx="10" fill="#1C1E21"/>
  <text x="450" y="309" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">RTSP / RTMP 拉流端</text>
  <text x="450" y="328" text-anchor="middle" font-size="10.5" fill="#9CA3AF">叠加效果与预览一致</text>

  <!-- channel labels -->
  <rect x="620" y="66" width="250" height="66" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="745" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">通道 A:Webhook(同步)</text>
  <text x="745" y="113" text-anchor="middle" font-size="10.5" fill="#9A3412">POST 人脸图 → 响应即结果</text>

  <rect x="620" y="146" width="250" height="66" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="745" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">通道 B:MQTT(异步)</text>
  <text x="745" y="193" text-anchor="middle" font-size="10.5" fill="#1E40AF">上报 topic 发图 · 接收 topic 回传</text>

  <!-- privacy note -->
  <rect x="620" y="226" width="250" height="116" rx="10" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="638" y="252" font-size="12" font-weight="700" fill="#166534">隐私边界</text>
  <text x="638" y="273" font-size="10.5" fill="#166534">· 马赛克仅作用于视频流</text>
  <text x="638" y="292" font-size="10.5" fill="#166534">· 原图仅发给配置的后端</text>
  <text x="638" y="311" font-size="10.5" fill="#166534">· 抓拍记录本地归档</text>
  <text x="638" y="330" font-size="10.5" fill="#166534">· 公网/公共 broker 需 TLS+鉴权</text>
</svg>
