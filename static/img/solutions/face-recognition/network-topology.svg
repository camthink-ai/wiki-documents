<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F24A00"/>
    </marker>
    <marker id="flowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="flowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1E21">组网拓扑(同一局域网,相机无公网要求)</text>

  <!-- LAN boundary -->
  <rect x="30" y="56" width="840" height="200" rx="14" fill="#FAFAFA" stroke="#D1D5DB" stroke-dasharray="8 6"/>
  <text x="52" y="80" font-size="12" font-weight="700" fill="#6B7280">客户局域网</text>

  <!-- camera -->
  <rect x="60" y="100" width="170" height="120" rx="10" fill="#1C1E21"/>
  <text x="145" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">NE302 相机</text>
  <text x="145" y="152" text-anchor="middle" font-size="10.5" fill="#9CA3AF">Wi-Fi 6 接入</text>
  <text x="145" y="172" text-anchor="middle" font-size="10.5" fill="#9CA3AF">USB Type-C 5V 供电</text>
  <text x="145" y="192" text-anchor="middle" font-size="10.5" fill="#FDBA74">检测/跟踪/马赛克/裁剪上报</text>

  <!-- router -->
  <rect x="330" y="118" width="150" height="84" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="405" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1E21">路由器 / AP</text>
  <text x="405" y="174" text-anchor="middle" font-size="10.5" fill="#6B7280">Wi-Fi · 有线口</text>

  <line x1="234" y1="160" x2="326" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#flow)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#6B7280">Wi-Fi</text>

  <!-- backend host -->
  <rect x="580" y="100" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#F24A00" stroke-width="1.5"/>
  <text x="670" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1E21">识别后端主机</text>
  <text x="670" y="152" text-anchor="middle" font-size="10.5" fill="#6B7280">自有服务 或 模拟后端脚本</text>
  <text x="670" y="172" text-anchor="middle" font-size="10.5" fill="#6B7280">同网段延迟 &lt; 1 秒</text>
  <text x="670" y="192" text-anchor="middle" font-size="10.5" fill="#FDBA74">gallery 人脸库(敏感数据)</text>

  <line x1="484" y1="160" x2="576" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#flow)"/>
  <text x="530" y="148" text-anchor="middle" font-size="10.5" fill="#6B7280">网线</text>

  <!-- viewers -->
  <rect x="60" y="290" width="180" height="58" rx="10" fill="#1C1E21"/>
  <text x="150" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">浏览器</text>
  <text x="150" y="332" text-anchor="middle" font-size="10.5" fill="#9CA3AF">相机 Web(预览/配置)</text>
  <path d="M150 286 L150 226" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#flow)"/>

  <!-- channel A webhook -->
  <path d="M234 120 C 340 60, 480 60, 576 120" fill="none" stroke="#F24A00" stroke-width="2" marker-end="url(#flow)"/>
  <text x="405" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">通道 A · Webhook(同步)</text>
  <text x="405" y="84" text-anchor="middle" font-size="10.5" fill="#C2410C">HTTP POST 人脸图 → 响应即结果(免 Broker)</text>

  <!-- channel B mqtt -->
  <path d="M234 200 C 340 258, 480 258, 576 200" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#flowb)"/>
  <text x="405" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">通道 B · MQTT(异步)</text>
  <text x="405" y="261" text-anchor="middle" font-size="10.5" fill="#1D4ED8">经 Broker:数据上报 topic 发图 · 数据接收 topic 回传</text>

  <!-- external broker optional -->
  <rect x="790" y="118" width="0" height="0" fill="none"/>
  <rect x="580" y="240" width="180" height="0" rx="0" fill="none"/>

  <!-- requirements note -->
  <rect x="30" y="362" width="840" height="30" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="450" y="382" text-anchor="middle" font-size="11" fill="#9A3412">带宽:视频走相机 Web 预览(局域网直连);识别上报为事件式,每次几十 KB · MQTT 通道另需一个 Broker(演示用公共 broker 仅限假数据)</text>
</svg>
